# Netlify 部署配置
# 关键：把 netlify/functions 目录下的服务端函数一起打包部署，
# 否则 /.netlify/functions/sb-proxy 不存在，云端同步仍会失败。

[build]
  # 静态文件所在目录（index.html / app.js / styles.css 都在项目根目录）
  publish = "."
  # 服务端函数目录
  functions = "netlify/functions"

# 定时保活：每天 UTC 09:00 向 Supabase 发一个极轻查询，
# 维持项目「活跃」，防止免费版因连续 7 天无流量被自动暂停。
[functions.keepalive]
  schedule = "0 9 * * *"

